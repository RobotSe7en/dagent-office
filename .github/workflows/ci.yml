name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/playwright.mjs install --with-deps chromium firefox webkit --only-shell
      - run: sudo apt-get install -y poppler-utils fonts-noto-cjk fonts-liberation2 python3-pil
      - run: pnpm build
      - run: node scripts/playwright.mjs test interaction.spec.ts workbench.spec.ts text-editor.spec.ts pagination.spec.ts rendering.spec.ts remote-access.spec.ts word-closure.spec.ts presentation.spec.ts presentation-editor.spec.ts presentation-workbench.spec.ts
      - run: /usr/bin/python3 scripts/check-presentation-reference.py && /usr/bin/python3 scripts/check-presentation-reference.py --browser firefox && /usr/bin/python3 scripts/check-presentation-reference.py --browser webkit
      - run: node scripts/install-legacy-chromium.mjs
      - run: node scripts/playwright.mjs test pagination.spec.ts presentation.spec.ts presentation-editor.spec.ts presentation-workbench.spec.ts --project=chromium
        env:
          DAGENT_OFFICE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.cache/legacy-browser/chromium-1041/chrome-linux/chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-preview-acceptance
          path: .cache/presentation-preview/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-interaction-results
          path: test-results/

  safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sudo safaridriver --enable
      - run: node scripts/safari-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-acceptance
          path: |
            .cache/safari-result.json
            .cache/safari-failure.png

  office-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc poppler-utils fonts-noto-cjk fonts-liberation2
      - run: pnpm check:pptx-fixtures && pnpm check:pptx-reference
      - run: pnpm check:docx-export
      - run: node scripts/playwright.mjs install --with-deps chromium --only-shell
      - run: pnpm check:word-closure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-docx-acceptance
          path: .cache/docx-export-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-word-closure
          path: .cache/word-closure-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-pptx-reference
          path: .cache/pptx-reference/result.json
