name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage_acceptance:
        description: Run full workbook scale acceptance before a stage merge
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DAGENT_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DAGENT_OFFICE_CI_MODE: daily

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
      - run: pnpm build
      - run: mkdir -p .cache && tar -czf .cache/ci-build.tar.gz packages/*/dist apps/playground/dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-build
          path: .cache/ci-build.tar.gz
          retention-days: 3

  check:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          restore-build: 'true'
      - run: pnpm check:boundaries
      - run: pnpm typecheck:built
      - run: pnpm test:built

  browser-engine:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, legacy-chromium]
        suite: [word, presentation, workbook]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          restore-build: 'true'
      - uses: ./.github/actions/ubuntu-downloads
      - uses: actions/cache@v4
        with:
          path: .playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-${{ matrix.browser }}
      - run: node scripts/playwright.mjs install --with-deps ${{ matrix.browser == 'legacy-chromium' && 'chromium' || matrix.browser }} --only-shell
        timeout-minutes: 10
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
      - run: sudo apt-get install -y poppler-utils fonts-noto-cjk fonts-liberation2 python3-pil
      - uses: actions/cache@v4
        if: matrix.browser == 'legacy-chromium'
        with:
          path: .cache/legacy-browser
          key: ${{ runner.os }}-legacy-browser-${{ hashFiles('scripts/install-legacy-chromium.mjs') }}
      - run: node scripts/install-legacy-chromium.mjs
        if: matrix.browser == 'legacy-chromium'
      - run: node scripts/ci-browser.mjs --browser ${{ matrix.browser }} --suite ${{ matrix.suite }} --mode daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.suite }}
          path: |
            .cache/ci-browser/${{ matrix.browser }}/${{ matrix.suite }}/
            .cache/presentation-preview/
          retention-days: 7

  browser-interaction:
    needs: browser-engine
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every browser and suite
        env:
          RESULT: ${{ needs.browser-engine.result }}
        run: test "$RESULT" = success

  safari:
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          restore-build: 'true'
      - run: sudo safaridriver --enable
      - run: node scripts/safari-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-acceptance
          path: |
            .cache/safari-result.json
            .cache/safari-failure.png

  office-suite:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [word, presentation, workbook]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          restore-build: 'true'
      - uses: ./.github/actions/ubuntu-downloads
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc python3-uno python3-lxml poppler-utils fonts-noto-cjk fonts-liberation2
      - uses: actions/cache@v4
        with:
          path: .cache/LibreOffice_25.8.1.1_Linux_x86-64_deb.tar.gz
          key: office-archive-f367c434aee8352e9742e192bedcdaef194ffcbcfeaf760c6300fb4fecbba73c
      - run: node scripts/install-acceptance-office.mjs
      - run: node scripts/install-acceptance-fonts.mjs
      - uses: actions/cache@v4
        if: matrix.suite != 'workbook'
        with:
          path: .playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-chromium
      - run: node scripts/playwright.mjs install --with-deps chromium --only-shell
        if: matrix.suite != 'workbook'
      - run: pnpm ci:office ${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-${{ matrix.suite }}
          path: |
            .cache/ci-office/${{ matrix.suite }}/
            .cache/docx-export-acceptance/
            .cache/word-closure-acceptance/
            .cache/pptx-reference/result.json
            .cache/xlsx-reference/result.json
            .cache/pptx-export-acceptance/
            .cache/presentation-closure-acceptance/
            .cache/acceptance-office/environment.json
            .cache/acceptance-fonts/environment.json
            .cache/acceptance-fonts/fonts.conf
            .cache/acceptance-fonts/licenses/
          retention-days: 7

  office-reopen:
    needs: office-suite
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every Office suite
        env:
          RESULT: ${{ needs.office-suite.result }}
        run: test "$RESULT" = success

  workbook-scale:
    needs: build
    if: contains(github.event.pull_request.labels.*.name, 'stage-acceptance') || inputs.stage_acceptance == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DAGENT_OFFICE_CI_MODE: full
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-project
        with:
          restore-build: 'true'
      - uses: ./.github/actions/ubuntu-downloads
      - run: node scripts/playwright.mjs install --with-deps chromium firefox webkit --only-shell
      - run: sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc python3-uno python3-lxml poppler-utils fonts-noto-cjk fonts-liberation2
      - uses: actions/cache@v4
        with:
          path: .cache/LibreOffice_25.8.1.1_Linux_x86-64_deb.tar.gz
          key: office-archive-f367c434aee8352e9742e192bedcdaef194ffcbcfeaf760c6300fb4fecbba73c
      - run: node scripts/install-acceptance-office.mjs
      - run: node scripts/install-acceptance-fonts.mjs
      - run: node scripts/install-legacy-chromium.mjs
      - run: pnpm check:workbook-scale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-scale-acceptance
          path: |
            .cache/workbook-scale-acceptance/
            .cache/workbook-reading-matrix-modern/
            .cache/workbook-reading-matrix-legacy/
            .cache/workbook-reading-budget/
          retention-days: 14
