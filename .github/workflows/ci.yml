name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser-interaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/playwright.mjs install --with-deps chromium firefox webkit --only-shell
      - run: sudo apt-get install -y poppler-utils fonts-noto-cjk fonts-liberation2 python3-pil
      - run: pnpm build
      - run: node scripts/playwright.mjs test workspace.spec.ts interaction.spec.ts workbench.spec.ts text-editor.spec.ts pagination.spec.ts rendering.spec.ts remote-access.spec.ts word-closure.spec.ts presentation.spec.ts presentation-editor.spec.ts presentation-workbench.spec.ts presentation-closure.spec.ts
      - run: node scripts/playwright.mjs test workbook-storage.spec.ts workbook-grid.spec.ts workbook-drawing.spec.ts workbook-drawing-window.spec.ts workbook-preview.spec.ts workbook-read-worker.spec.ts workbook-playground.spec.ts --output=.cache/workbook-browser/modern
      - run: /usr/bin/python3 scripts/check-presentation-reference.py && /usr/bin/python3 scripts/check-presentation-reference.py --browser firefox && /usr/bin/python3 scripts/check-presentation-reference.py --browser webkit
      - run: node scripts/install-legacy-chromium.mjs
      - run: node scripts/playwright.mjs test workspace.spec.ts pagination.spec.ts presentation.spec.ts presentation-editor.spec.ts presentation-workbench.spec.ts presentation-closure.spec.ts --project=chromium
        env:
          DAGENT_OFFICE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.cache/legacy-browser/chromium-1041/chrome-linux/chrome
      - run: node scripts/playwright.mjs test workbook-storage.spec.ts workbook-grid.spec.ts workbook-drawing.spec.ts workbook-drawing-window.spec.ts workbook-preview.spec.ts workbook-read-worker.spec.ts workbook-playground.spec.ts --project=chromium --output=.cache/workbook-browser/legacy
        env:
          DAGENT_OFFICE_BROWSER_EXECUTABLE: ${{ github.workspace }}/.cache/legacy-browser/chromium-1041/chrome-linux/chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-preview-acceptance
          path: .cache/presentation-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbook-reading-checks
          path: .cache/workbook-browser/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-interaction-results
          path: test-results/

  safari:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: sudo safaridriver --enable
      - run: node scripts/safari-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-acceptance
          path: |
            .cache/safari-result.json
            .cache/safari-failure.png

  office-reopen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc python3-uno python3-lxml poppler-utils fonts-noto-cjk fonts-liberation2
      - run: node scripts/install-acceptance-office.mjs
      - run: pnpm check:pptx-fixtures && pnpm check:pptx-reference
      - run: pnpm check:xlsx-fixtures && pnpm check:xlsx-reference
      - run: python3 scripts/check-xlsx-chart-formulas.py
      - run: python3 scripts/check-xlsx-row-appearance.py
      - run: python3 scripts/check-xlsx-hidden-row-heights.py
      - run: python3 scripts/check-xlsx-comment-mentions.py
      - run: python3 scripts/check-xlsx-comment-uids.py
      - run: python3 scripts/check-xlsx-dual-note-boxes.py
      - run: python3 scripts/check-xlsx-text-overflow.py
      - run: python3 scripts/check-xlsx-chart-colors.py
      - run: python3 scripts/check-xlsx-chart-markers.py
      - run: python3 scripts/check-xlsx-chart-auto-markers.py
      - run: python3 scripts/check-xlsx-chart-grid.py
      - run: python3 scripts/check-xlsx-chart-axes.py
      - run: pnpm check:docx-export
      - run: node scripts/playwright.mjs install --with-deps chromium --only-shell
      - run: pnpm check:word-closure
      - run: pnpm check:pptx-export
      - run: pnpm check:presentation-closure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-docx-acceptance
          path: .cache/docx-export-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-word-closure
          path: .cache/word-closure-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-pptx-reference
          path: .cache/pptx-reference/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-xlsx-reference
          path: .cache/xlsx-reference/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pptx-acceptance
          path: .cache/pptx-export-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-presentation-closure
          path: .cache/presentation-closure-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-office-environment
          path: .cache/acceptance-office/environment.json
